    <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Футер сайта</title>
    <link rel="stylesheet" href="style-footer.css" />
</head>
<body>
    <!-- Основной футер -->
<div style="
  width: 100%; /* или нужная ширина */
  height: 1000px; /* высота блока */
  background-color: transparent; /* прозрачный фон или цвет по желанию */
  pointer-events: none; /* отключает взаимодействие с содержимым внутри */
  position: relative;
  z-index: 9999; /* чтобы блок был поверх других элементов */
">
</div>
    <footer class="site-footer">
        <div class="footer-content">
            <!-- Адрес и иконки приложений -->
            <div class="section address-icons">
                <div class="section-title">Контакты</div>
                <div class="address">
                    Город Нефтеюгнск, 11б микрорайон, 19, Нефтеюганск, Ханты-Мансийский АО, 628305
                </div>
                <div class="app-icons">
                    <a href="#" >
                        <img src="img/TG.png" class="app-icon" alt="Telegram">
                    </a>
                    <a href="#" >
                        <img src="img/VK.png" class="app-icon" alt="Telegram">
                    </a>
                </div>
            </div>
            <!-- Услуги -->
            <div class="section services">
                <div class="section-title">Услуги</div>
                <div class="service-item"><a href="#">Создание игры</a></div>
                <div class="service-item"><a href="#">Аналитика данных</a></div>
                <div class="service-item"><a href="#">API интеграции</a></div>
                <div class="service-item"><a href="#">Комьюнити менеджмент</a></div>
                <div class="service-item"><a href="#">Организация тестирования</a></div>
            </div>
            <!-- Команда -->
            <div class="section team">
                <div class="section-title">Наша команда</div>
                <div class="team-names">Имена</div>
                <a href="mailto:example@domain.com" class="email-link">
                    <div class="email">Почтовый адрес: </div>
                </a>
            </div>
        </div>
        <!-- Защита прав (обычный текст) -->
        <div class="rights-text">
            © 2021 DAR Studio, все права защищены.
        </div>
    </footer>
</body>
</html>
</body>
</html>
